<svg id="fig7b" viewBox="0 0 780 440" role="img" aria-label="Two proposed mechanisms. Left, Denmark and Houk 2020: an aldehyde docks at both open zinc sites of the homochiral tetramer to give product; the heterochiral tetramer cannot dock. Right, Trapp 2020 to 25: monomer plus aldehyde forms a zinc hemiacetal in a slow step, then + aldehyde, i-Pr₂Zn → alkyl transfer, giving two hemiacetal catalysts that feed back. Open: may depend on substrate" xmlns="http://www.w3.org/2000/svg"><defs><marker id="fig7b-g" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto-start-reverse"><path d="M0,0.8 L10,5 L0,9.2 z" fill="#8a9bab"/></marker><marker id="fig7b-s" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto-start-reverse"><path d="M0,0.8 L10,5 L0,9.2 z" fill="#4aa8ff"/></marker></defs><line x1="400.0" y1="20.0" x2="400.0" y2="392.0" stroke="#1e2c3a" stroke-width="1.5" /><text x="200.0" y="32.0" font-size="17" fill="#ffb547" text-anchor="middle" font-weight="700">Denmark/Houk 2020</text><text x="590.0" y="32.0" font-size="17" fill="#4aa8ff" text-anchor="middle" font-weight="700">Trapp 2020–25</text><rect x="50.0" y="118.0" width="210.0" height="52.0" rx="10" fill="#101a24" stroke="#ffb547" stroke-width="2" /><text x="155.0" y="150.0" font-size="14" fill="#e6edf3" text-anchor="middle">homochiral tetramer</text><circle cx="100.0" cy="118.0" r="7" fill="#0c131b" stroke="#5fd39a" stroke-width="2" /><circle cx="210.0" cy="118.0" r="7" fill="#0c131b" stroke="#5fd39a" stroke-width="2" /><rect x="80.0" y="72.0" width="150.0" height="26.0" rx="6" fill="#1b2733" stroke="#a9b8c6" stroke-width="1.5" /><text x="155.0" y="90.0" font-size="13.5" fill="#e6edf3" text-anchor="middle">aldehyde</text><line x1="100.0" y1="98.0" x2="100.0" y2="110.0" stroke="#5fd39a" stroke-width="2" stroke-dasharray="3 3"/><line x1="210.0" y1="98.0" x2="210.0" y2="110.0" stroke="#5fd39a" stroke-width="2" stroke-dasharray="3 3"/><text x="155.0" y="60.0" font-size="13" fill="#a9b8c6" text-anchor="middle">docks at both open Zn sites</text><line x1="266.0" y1="144.0" x2="312.0" y2="144.0" stroke="#8a9bab" stroke-width="2" marker-end="url(#fig7b-g)"/><text x="320.0" y="140.0" font-size="14" fill="#e6edf3" text-anchor="start">product</text><text x="320.0" y="158.0" font-size="12.5" fill="#a9b8c6" text-anchor="start">(same hand)</text><rect x="50.0" y="272.0" width="210.0" height="52.0" rx="10" fill="#101a24" stroke="#8a9bab" stroke-width="1.5" stroke-dasharray="5 4"/><text x="155.0" y="304.0" font-size="14" fill="#a9b8c6" text-anchor="middle">heterochiral tetramer</text><rect x="80.0" y="224.0" width="150.0" height="26.0" rx="6" fill="#1b2733" stroke="#8a9bab" stroke-width="1.5" /><text x="155.0" y="242.0" font-size="13.5" fill="#8a9bab" text-anchor="middle">aldehyde</text><line x1="145.0" y1="252.0" x2="165.0" y2="270.0" stroke="#ff6b5e" stroke-width="3" /><line x1="165.0" y1="252.0" x2="145.0" y2="270.0" stroke="#ff6b5e" stroke-width="3" /><text x="155.0" y="350.0" font-size="14" fill="#ff6b5e" text-anchor="middle" font-weight="600">can't dock: wrong geometry</text><rect x="470.0" y="53.0" width="240.0" height="58.0" rx="10" fill="#101a24" stroke="#a9b8c6" stroke-width="1.8" /><text x="590.0" y="78.0" font-size="14" fill="#e6edf3" text-anchor="middle"><tspan x="590.0" dy="0em">Zn alkoxide monomer</tspan><tspan x="590.0" dy="1.28em">+ aldehyde</tspan></text><rect x="470.0" y="161.0" width="240.0" height="58.0" rx="10" fill="#101a24" stroke="#4aa8ff" stroke-width="1.8" /><text x="590.0" y="186.0" font-size="14" fill="#e6edf3" text-anchor="middle"><tspan x="590.0" dy="0em">zinc hemiacetal</tspan><tspan x="590.0" dy="1.28em">(product + aldehyde bound)</tspan></text><rect x="470.0" y="267.0" width="240.0" height="58.0" rx="10" fill="#101a24" stroke="#a9b8c6" stroke-width="1.8" /><text x="590.0" y="292.0" font-size="14" fill="#e6edf3" text-anchor="middle"><tspan x="590.0" dy="0em">+ aldehyde, i-Pr₂Zn</tspan><tspan x="590.0" dy="1.28em">→ alkyl transfer</tspan></text><line x1="590.0" y1="111.0" x2="590.0" y2="158.0" stroke="#8a9bab" stroke-width="2" marker-end="url(#fig7b-g)"/><text x="600.0" y="141.0" font-size="13" fill="#ffd08a" text-anchor="start" font-weight="600">slow step</text><line x1="590.0" y1="222.0" x2="590.0" y2="276.0" stroke="#8a9bab" stroke-width="2" marker-end="url(#fig7b-g)"/><line x1="590.0" y1="316.0" x2="590.0" y2="346.0" stroke="#8a9bab" stroke-width="2" marker-end="url(#fig7b-g)"/><rect x="470.0" y="350.0" width="240.0" height="34.0" rx="10" fill="#101a24" stroke="#4aa8ff" stroke-width="1.8" /><text x="590.0" y="372.0" font-size="14" fill="#e6edf3" text-anchor="middle" font-weight="600">2 × hemiacetal catalyst</text><path d="M 468,367 C 420,367 420,190 466,190" stroke="#4aa8ff" stroke-width="2.4" fill="none" marker-end="url(#fig7b-s)"/><text x="412.0" y="280.0" font-size="16" fill="#4aa8ff" text-anchor="end" font-weight="700">×2</text><text x="390.0" y="425.0" font-size="14.5" fill="#c9a3ff" text-anchor="middle" font-weight="600">Open: may depend on substrate</text></svg>