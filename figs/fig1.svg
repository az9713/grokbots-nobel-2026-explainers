<svg id="fig1" viewBox="0 0 960 340" role="img" aria-label="Timeline from Frank 1953 to the 2026 Nobel Prize, with 2001 and 2021 related prizes marked in grey" xmlns="http://www.w3.org/2000/svg"><line x1="40.0" y1="150.0" x2="925.0" y2="150.0" stroke="#2a3d50" stroke-width="3" /><text x="40.0" y="28.0" font-size="13" fill="#8a9bab" text-anchor="start">Related Nobel Prizes (grey) · spacing not to scale</text><line x1="479.5" y1="150.0" x2="479.5" y2="98.0" stroke="#8a9bab" stroke-width="1.5" stroke-dasharray="3 3"/><rect x="473.5" y="144" width="12" height="12" transform="rotate(45 479.5 150)" fill="#8a9bab"/><text x="479.5" y="62.0" font-size="13" fill="#8a9bab" text-anchor="middle"><tspan x="479.5" dy="0em">2001 Nobel:</tspan><tspan x="479.5" dy="1.28em">asymmetric catalysis</tspan></text><line x1="830.5" y1="150.0" x2="830.5" y2="98.0" stroke="#8a9bab" stroke-width="1.5" stroke-dasharray="3 3"/><rect x="824.5" y="144" width="12" height="12" transform="rotate(45 830.5 150)" fill="#8a9bab"/><text x="830.5" y="62.0" font-size="13" fill="#8a9bab" text-anchor="middle"><tspan x="830.5" dy="0em">2021 Nobel:</tspan><tspan x="830.5" dy="1.28em">asymmetric organocatalysis</tspan></text><line x1="70.0" y1="158.0" x2="70.0" y2="166.0" stroke="#2a3d50" stroke-width="1.5" /><circle cx="70.0" cy="150.0" r="6" fill="#a9b8c6" stroke="#0c131b" stroke-width="2" /><text x="70.0" y="182.0" font-size="16" fill="#e6edf3" text-anchor="middle" font-weight="700">1953</text><text x="70.0" y="202.0" font-size="13.5" fill="#a9b8c6" text-anchor="middle">Frank's theory</text><line x1="187.0" y1="158.0" x2="187.0" y2="246.0" stroke="#ffb547" stroke-width="1.5" /><circle cx="187.0" cy="150.0" r="8" fill="#ffb547" stroke="#0c131b" stroke-width="2" /><text x="187.0" y="262.0" font-size="16" fill="#ffb547" text-anchor="middle" font-weight="700">1986</text><text x="187.0" y="282.0" font-size="13.5" fill="#e6edf3" text-anchor="middle">Kagan: non-linear effects</text><line x1="304.0" y1="158.0" x2="304.0" y2="166.0" stroke="#2a3d50" stroke-width="1.5" /><circle cx="304.0" cy="150.0" r="6" fill="#a9b8c6" stroke="#0c131b" stroke-width="2" /><text x="304.0" y="182.0" font-size="16" fill="#e6edf3" text-anchor="middle" font-weight="700">1990</text><text x="304.0" y="202.0" font-size="13.5" fill="#a9b8c6" text-anchor="middle"><tspan x="304.0" dy="0em">Soai: first asymmetric</tspan><tspan x="304.0" dy="1.28em">autocatalysis (purity</tspan><tspan x="304.0" dy="1.28em">erodes)</tspan></text><line x1="421.0" y1="158.0" x2="421.0" y2="246.0" stroke="#ffb547" stroke-width="1.5" /><circle cx="421.0" cy="150.0" r="8" fill="#ffb547" stroke="#0c131b" stroke-width="2" /><text x="421.0" y="262.0" font-size="16" fill="#ffb547" text-anchor="middle" font-weight="700">1995</text><text x="421.0" y="282.0" font-size="13.5" fill="#e6edf3" text-anchor="middle"><tspan x="421.0" dy="0em">Soai: autocatalysis with</tspan><tspan x="421.0" dy="1.28em">amplification</tspan></text><line x1="538.0" y1="158.0" x2="538.0" y2="166.0" stroke="#2a3d50" stroke-width="1.5" /><circle cx="538.0" cy="150.0" r="6" fill="#a9b8c6" stroke="#0c131b" stroke-width="2" /><text x="538.0" y="182.0" font-size="16" fill="#e6edf3" text-anchor="middle" font-weight="700">2002–03</text><text x="538.0" y="202.0" font-size="13.5" fill="#a9b8c6" text-anchor="middle"><tspan x="538.0" dy="0em">Singleton and Soai,</tspan><tspan x="538.0" dy="1.28em">independently: handedness</tspan><tspan x="538.0" dy="1.28em">with no chiral input</tspan></text><line x1="655.0" y1="158.0" x2="655.0" y2="246.0" stroke="#2a3d50" stroke-width="1.5" /><circle cx="655.0" cy="150.0" r="6" fill="#a9b8c6" stroke="#0c131b" stroke-width="2" /><text x="655.0" y="262.0" font-size="16" fill="#e6edf3" text-anchor="middle" font-weight="700">2015</text><text x="655.0" y="282.0" font-size="13.5" fill="#a9b8c6" text-anchor="middle"><tspan x="655.0" dy="0em">X-ray structures of the</tspan><tspan x="655.0" dy="1.28em">zinc tetramers</tspan></text><line x1="772.0" y1="158.0" x2="772.0" y2="166.0" stroke="#2a3d50" stroke-width="1.5" /><circle cx="772.0" cy="150.0" r="6" fill="#a9b8c6" stroke="#0c131b" stroke-width="2" /><text x="772.0" y="182.0" font-size="16" fill="#e6edf3" text-anchor="middle" font-weight="700">2020</text><text x="772.0" y="202.0" font-size="13.5" fill="#a9b8c6" text-anchor="middle"><tspan x="772.0" dy="0em">Two rival mechanisms</tspan><tspan x="772.0" dy="1.28em">(Denmark; Trapp)</tspan></text><line x1="889.0" y1="158.0" x2="889.0" y2="246.0" stroke="#ffb547" stroke-width="1.5" /><circle cx="889.0" cy="150.0" r="8" fill="#ffb547" stroke="#0c131b" stroke-width="2" /><text x="889.0" y="262.0" font-size="16" fill="#ffb547" text-anchor="middle" font-weight="700">2026</text><text x="889.0" y="282.0" font-size="13.5" fill="#e6edf3" text-anchor="middle">Nobel Prize</text></svg>