<svg id="fig1n" viewBox="0 0 400 516" role="img" aria-label="Timeline from Frank 1953 to the 2026 Nobel Prize (narrow layout)" xmlns="http://www.w3.org/2000/svg"><line x1="30.0" y1="31.0" x2="30.0" y2="481.0" stroke="#2a3d50" stroke-width="3" /><circle cx="30.0" cy="31.0" r="5.5" fill="#a9b8c6" stroke="#0c131b" stroke-width="2" /><text x="52.0" y="36.0" font-size="15" fill="#e6edf3" text-anchor="start" font-weight="700">1953</text><text x="130.0" y="36.0" font-size="14" fill="#a9b8c6" text-anchor="start">Frank's theory</text><circle cx="30.0" cy="67.0" r="7" fill="#ffb547" stroke="#0c131b" stroke-width="2" /><text x="52.0" y="72.0" font-size="15" fill="#ffb547" text-anchor="start" font-weight="700">1986</text><text x="130.0" y="72.0" font-size="14" fill="#e6edf3" text-anchor="start">Kagan: non-linear effects</text><circle cx="30.0" cy="103.0" r="5.5" fill="#a9b8c6" stroke="#0c131b" stroke-width="2" /><text x="52.0" y="108.0" font-size="15" fill="#e6edf3" text-anchor="start" font-weight="700">1990</text><text x="130.0" y="108.0" font-size="14" fill="#a9b8c6" text-anchor="start"><tspan x="130.0" dy="0em">Soai: first asymmetric</tspan><tspan x="130.0" dy="1.28em">autocatalysis (purity erodes)</tspan></text><circle cx="30.0" cy="157.0" r="7" fill="#ffb547" stroke="#0c131b" stroke-width="2" /><text x="52.0" y="162.0" font-size="15" fill="#ffb547" text-anchor="start" font-weight="700">1995</text><text x="130.0" y="162.0" font-size="14" fill="#e6edf3" text-anchor="start"><tspan x="130.0" dy="0em">Soai: autocatalysis with</tspan><tspan x="130.0" dy="1.28em">amplification</tspan></text><rect x="25" y="206" width="10" height="10" transform="rotate(45 30 211)" fill="#8a9bab"/><text x="52.0" y="216.0" font-size="15" fill="#8a9bab" text-anchor="start" font-weight="700">2001</text><text x="130.0" y="216.0" font-size="14" fill="#8a9bab" text-anchor="start">Nobel: asymmetric catalysis</text><circle cx="30.0" cy="247.0" r="5.5" fill="#a9b8c6" stroke="#0c131b" stroke-width="2" /><text x="52.0" y="252.0" font-size="15" fill="#e6edf3" text-anchor="start" font-weight="700">2002–03</text><text x="130.0" y="252.0" font-size="14" fill="#a9b8c6" text-anchor="start"><tspan x="130.0" dy="0em">Singleton and Soai,</tspan><tspan x="130.0" dy="1.28em">independently: handedness with</tspan><tspan x="130.0" dy="1.28em">no chiral input</tspan></text><circle cx="30.0" cy="319.0" r="5.5" fill="#a9b8c6" stroke="#0c131b" stroke-width="2" /><text x="52.0" y="324.0" font-size="15" fill="#e6edf3" text-anchor="start" font-weight="700">2015</text><text x="130.0" y="324.0" font-size="14" fill="#a9b8c6" text-anchor="start"><tspan x="130.0" dy="0em">X-ray structures of the zinc</tspan><tspan x="130.0" dy="1.28em">tetramers</tspan></text><circle cx="30.0" cy="373.0" r="5.5" fill="#a9b8c6" stroke="#0c131b" stroke-width="2" /><text x="52.0" y="378.0" font-size="15" fill="#e6edf3" text-anchor="start" font-weight="700">2020</text><text x="130.0" y="378.0" font-size="14" fill="#a9b8c6" text-anchor="start"><tspan x="130.0" dy="0em">Two rival mechanisms (Denmark;</tspan><tspan x="130.0" dy="1.28em">Trapp)</tspan></text><rect x="25" y="422" width="10" height="10" transform="rotate(45 30 427)" fill="#8a9bab"/><text x="52.0" y="432.0" font-size="15" fill="#8a9bab" text-anchor="start" font-weight="700">2021</text><text x="130.0" y="432.0" font-size="14" fill="#8a9bab" text-anchor="start"><tspan x="130.0" dy="0em">Nobel: asymmetric</tspan><tspan x="130.0" dy="1.28em">organocatalysis</tspan></text><circle cx="30.0" cy="481.0" r="7" fill="#ffb547" stroke="#0c131b" stroke-width="2" /><text x="52.0" y="486.0" font-size="15" fill="#ffb547" text-anchor="start" font-weight="700">2026</text><text x="130.0" y="486.0" font-size="14" fill="#e6edf3" text-anchor="start">Nobel Prize</text></svg>